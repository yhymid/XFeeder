[package]
name = "xfeeder"
version = "3.0.0"
edition = "2024"
rust-version = "1.88"
description = "Modular RSS/Atom/JSON feed reader for Discord webhooks and Telegram."
license = "MIT"
repository = "https://github.com/yhymid/XFeeder"
publish = false

[[bin]]
name = "xfeeder"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "query", "json"] }
bytes = "1.12.1"
chrono = "0.4.45"
encoding_rs = "0.8.35"
futures-util = "0.3.34"
hex = "0.4.3"
libc = "0.2.191"
quick-xml = "0.41.0"
rand = "0.10.4"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "gzip", "brotli", "deflate", "json", "stream", "http2", "charset"] }
scraper = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha1 = "0.11.0"
sha2 = "0.11.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "process", "fs", "time", "sync", "io-util", "net"] }
tokio-util = "0.7.20"
url = "2.5.8"
