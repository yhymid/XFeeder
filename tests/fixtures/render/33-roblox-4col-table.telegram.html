<b>[Studio Beta] UI Particles</b>

<tg-time unix="1795780800" format="Dt">2026-11-27 12:00 UTC</tg-time>

To trigger a one-shot burst, call :Emit(n). To clear all active particles instantly, call :Clear().
To create slow-motion effects, set TimeScale to 0.5. Freeze particles in place by setting it to 0.
